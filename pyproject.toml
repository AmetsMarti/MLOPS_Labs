[project]
name = "mlops-labs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.1",
    "pillow>=13.0.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]
[project.scripts]
mlops = "cli.cli:cli"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "business*", "cli*"]
exclude = ["tests*"]
